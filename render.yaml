services:
  - type: web
    name: fanora-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./fanora.db
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      - key: RUN_MIGRATIONS
        value: "false"
      - key: CHAIN_WRITES_ENABLED
        value: "false"
      - key: FRONTEND_ORIGINS
        value: https://fanora-orpin.vercel.app
      - key: FRONTEND_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: INTERNAL_API_KEY
        generateValue: true
